name: Publisher Unit Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "publish.py"
      - "test_publish.py"
      - ".github/workflows/test-cycle-discovery.yml"
  push:
    branches:
      - fix/ecmwf-cycle-discovery-probe
    paths:
      - "publish.py"
      - "test_publish.py"
      - ".github/workflows/test-cycle-discovery.yml"

permissions:
  contents: read

concurrency:
  group: publisher-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy eccodes

      - name: Run isolated publisher unit tests
        run: python -m unittest -v test_publish.py

      - name: Probe the newest complete live ECMWF cycle without publishing
        run: python publish.py --model ecmwf --site . --discover-only
