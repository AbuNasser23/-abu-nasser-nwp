name: Test NWP Publisher

on:
  push:
    branches:
      - fix/ecmwf-gusts-fallback-144h
    paths:
      - "publish.py"
      - "test_publish.py"
      - ".github/workflows/test-publisher.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-nwp-publisher-gusts-fallback
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy eccodes

      - name: Run publisher unit tests only
        run: python -m unittest -v test_publish.py
