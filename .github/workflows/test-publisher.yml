name: Test NWP Publisher

on:
  push:
    branches:
      - main
      - feat/ecmwf-0p1-grid
      - fix/ecmwf-gusts-fallback-144h
      - fix/automatic-main-validation-144h
      - feat/publisher-240h-validated
      - fix/republish-same-cycle-on-horizon-upgrade
    paths:
      - "publish.py"
      - "test_publish.py"
      - ".github/workflows/test-publisher.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-nwp-publisher-gusts-fallback
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy eccodes

      - name: Run publisher unit tests only
        run: python -m unittest -v test_publish.py
      - name: Smoke-test one live ECMWF 0.1 forecast step
        run: |
          python - <<'PY'
          import publish
          run = publish.discover("ecmwf")
          fields, geo = publish.pull_ecmwf_step(run, 0)
          spec = publish.grid_spec("ecmwf")
          assert len(geo["lons"]) == spec["nx"], (len(geo["lons"]), spec)
          assert len(geo["lats"]) == spec["ny"], (len(geo["lats"]), spec)
          assert "t2m" in fields and "t850" in fields, sorted(fields)
          print(f"ECMWF live smoke PASS: {publish.iso_of(run)}; grid={len(geo['lons'])}x{len(geo['lats'])}; fields={len(fields)}")
          PY
      - name: Smoke-test one live GFS 0.25 forecast step
        run: |
          python - <<'PY'
          import publish
          run = publish.discover("gfs")
          fields, geo = publish.decode_gfs_step(publish.pull_gfs_blob(run, 0))
          spec = publish.grid_spec("gfs")
          assert len(geo["lons"]) == spec["nx"], (len(geo["lons"]), spec)
          assert len(geo["lats"]) == spec["ny"], (len(geo["lats"]), spec)
          assert "t2m" in fields, sorted(fields)
          print(f"GFS live smoke PASS: {publish.iso_of(run)}; grid={len(geo['lons'])}x{len(geo['lats'])}; fields={len(fields)}")
          PY
      - name: Validate complete ECMWF 0.1 240-hour cycle without publishing
        timeout-minutes: 165
        run: |
          python - <<'PY'
          import publish
          run = publish.discover("ecmwf")
          pack = publish.assemble("ecmwf", run)
          publish.sanity(pack)
          files, digests = publish.bundle_files(pack)
          total = sum(len(data) for data in files.values())
          largest = max((len(data), name) for name, data in files.items())
          print(f"ECMWF FULL CYCLE PASS: run={publish.iso_of(run)} steps={len(publish.hours('ecmwf'))} grid={len(pack['lons'])}x{len(pack['lats'])} fields={len(files)} compressed_total={total} bytes largest={largest[1]}:{largest[0]} bytes")
          print(f"ECMWF cycle notes: {pack.get('notes', [])}")
          PY
