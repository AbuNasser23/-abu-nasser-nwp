name: Publish NWP Data

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-nwp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy eccodes

      - name: Publish ECMWF
        id: ecmwf
        continue-on-error: true
        run: |
          python publish.py --model ecmwf --site .

      - name: Publish GFS
        id: gfs
        continue-on-error: true
        run: |
          python publish.py --model gfs --site .

      - name: Save published data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update automatic weather data"
          git push

      - name: Check publishing results
        if: always()
        run: |
          if [ "${{ steps.ecmwf.outcome }}" != "success" ] || [ "${{ steps.gfs.outcome }}" != "success" ]; then
            echo "One or more models failed. Check the logs."
            exit 1
          fi
          echo "ECMWF and GFS published successfully."
