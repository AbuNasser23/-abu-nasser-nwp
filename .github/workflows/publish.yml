name: Publish NWP Data

on:
  push:
    branches:
      - main
    paths:
      - "publish.py"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-nwp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy eccodes

      - name: Publish ECMWF
        id: ecmwf
        continue-on-error: true
        run: |
          python publish.py --model ecmwf --site .

      - name: Publish GFS
        id: gfs
        continue-on-error: true
        run: |
          python publish.py --model gfs --site .

      - name: Save published data
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update automatic weather data"
          fi

          # Reconcile with any commit that reached main while this run was building.
          for attempt in 1 2 3; do
            git fetch --deepen=20 origin main
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "Rebase conflict: refusing to overwrite newer repository data."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Published data saved to main."
              exit 0
            fi
            echo "Push race on attempt $attempt; fetching latest main and retrying."
          done

          echo "Could not push after three safe synchronization attempts."
          exit 1

      - name: Check publishing results
        if: always()
        run: |
          if [ "${{ steps.ecmwf.outcome }}" != "success" ] || [ "${{ steps.gfs.outcome }}" != "success" ]; then
            echo "One or more models failed. Check the logs."
            exit 1
          fi
          echo "ECMWF and GFS published successfully."
